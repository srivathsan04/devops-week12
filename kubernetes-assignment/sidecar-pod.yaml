apiVersion: v1
kind: Pod
metadata:
  name: app-with-sidecar
  labels:
    app: web-application
spec:
  containers:
    - name: main-app
      image: busybox
      args:
        - /bin/sh
        - -c
        - >
          while true;
          do
            echo "$(date): Application log entry" >> /var/log/app/app.log;
            sleep 5;
          done
      volumeMounts:
        - name: log-volume
          mountPath: /var/log/app

    - name: log-sidecar
      image: busybox
      args:
        - /bin/sh
        - -c
        - >
          tail -f /var/log/app/app.log
      volumeMounts:
        - name: log-volume
          mountPath: /var/log/app

  volumes:
    - name: log-volume
      emptyDir: {}
